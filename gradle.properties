org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=hiddenmaterials
mod_name=Hidden Materials
mod_version=1.0
mod_group=com.mpp.hiddenmaterials

# RFG supplies Forge 14.23.5.2847 for Minecraft 1.12.2.
mc_version=1.12.2
mapping_channel=snapshot
mapping_version=20171003

mixinbooter_version=11.18
mixin_config=hiddenmaterials.mixins.json

# 1.12.2 mod dependencies. CraftTweaker and Game Stages publish to BlameJared's
# maven; Tinkers' Antique has no official maven, so it comes from Curse Maven.
crafttweaker_version=1.12-4.1.20.716
gamestages_version=2.0.123
# Tinkers' Antique 1.12.2-2.13.0.209; Curse Maven addresses it by project and file id.
tinkers_antique_project_id=1242239
tinkers_antique_file_id=8666425
# Mantle 1.12-1.3.3.55, the library Tinkers' Antique is built against. Needed
# because the Tinkers book and material classes extend Mantle types.
mantle_project_id=74924
mantle_file_id=2713386
# Bookshelf 1.12.2-2.3.590. Game Stages refuses to load without it, so dev runs
# need it on the classpath even though this mod never touches its classes.
bookshelf_project_id=228525
bookshelf_file_id=2836960
